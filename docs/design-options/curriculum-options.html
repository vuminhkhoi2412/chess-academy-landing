<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Chess – 3 hướng thiết kế cho phần giáo trình</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#0b2136;--navy-900:#123350;--navy-800:#184268;--navy-700:#1b4a76;--navy-600:#1f5285;--navy-500:#2f6ba3;
  --navy-300:#8fb4d6;--navy-200:#b6d0e8;--navy-100:#d9e8f5;--navy-50:#eef5fb;
  --cream:#faf8f5;--paper:#fffdf9;--ink:#0f172a;--ink-2:#334155;--ink-3:#64748b;--rule:#e2e8f0;
  --amber:#fbbf24;--amber-700:#b45309;--emerald-700:#047857;
  --hc:#184268;--sc:#b45309;--tc:#047857;
  --display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --sans:"Be Vietnam Pro",system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased}
::selection{background:var(--amber);color:var(--navy-950)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--amber-700);outline-offset:3px}
ul,ol{list-style:none;padding:0}
.wrap{max-width:72rem;margin:0 auto;padding:0 1rem}
.num{font-variant-numeric:tabular-nums}

/* --- khung xem trước --- */
.bar{position:sticky;top:0;z-index:20;background:var(--navy-950);color:#fff;border-bottom:1px solid #ffffff22}
.bar .wrap{display:flex;gap:.25rem;align-items:center;flex-wrap:wrap;padding-block:.5rem}
.bar b{font-family:var(--display);margin-right:auto;font-size:.9375rem;letter-spacing:-.01em}
.bar button{padding:.5rem .875rem;font-size:.8125rem;font-weight:600;color:var(--navy-200);min-height:2.75rem;border-bottom:2px solid transparent}
.bar button[aria-selected=true]{color:#fff;border-color:var(--amber)}
.bar button:hover{color:#fff}
.picker{padding:1.25rem 0 .5rem;border-bottom:1px solid var(--rule);background:var(--cream)}
.picker p{font-size:.8125rem;color:var(--ink-3);margin-bottom:.5rem}
.picker ol{display:flex;gap:.375rem;flex-wrap:wrap}
.picker button{padding:.375rem .75rem;min-height:2.5rem;font-size:.8125rem;font-weight:700;border:1px solid var(--rule);background:#fff;font-variant-numeric:tabular-nums}
.picker button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.stage{padding:3rem 0 5rem}
.stage[hidden]{display:none}
.note{font-size:.8125rem;color:var(--ink-3);max-width:46rem;margin:0 0 2rem}
h2.t{font-family:var(--display);font-weight:800;letter-spacing:-.02em;line-height:1.1}

/* =========================================================
   A · GÁY SÁCH
   ========================================================= */
.a-book{display:grid;grid-template-columns:minmax(0,1fr);background:var(--paper);box-shadow:0 1px 0 #fff inset,0 18px 40px -22px rgb(15 23 42/.35),0 2px 6px -2px rgb(15 23 42/.12)}
.a-spine{background:var(--lc);color:#fff;display:flex;flex-direction:row;align-items:center;justify-content:space-between;padding:.875rem 1.25rem;gap:1rem}
.a-spine .code{font-family:var(--display);font-weight:800;font-size:2.5rem;letter-spacing:-.03em;line-height:1}
.a-spine .prog{font-size:.8125rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.9}
.a-page{padding:1.5rem 1.25rem 2rem}
.a-page h3{font-family:var(--display);font-weight:800;font-size:clamp(1.625rem,4.4vw,2.75rem);line-height:1.08;letter-spacing:-.02em;text-wrap:balance;max-width:18ch}
.a-meta{display:flex;flex-wrap:wrap;gap:.25rem 1.5rem;margin-top:1rem;font-size:.875rem;color:var(--ink-3)}
.a-meta b{color:var(--ink);font-weight:700}
.a-goal{margin-top:1.5rem;font-size:1.125rem;line-height:1.6;color:var(--ink-2);max-width:42ch;text-wrap:pretty;padding-top:1.25rem;border-top:1px solid var(--rule)}
@media(min-width:48rem){
  .a-book{grid-template-columns:5.5rem minmax(0,1fr) 15rem}
  .a-spine{flex-direction:column;justify-content:space-between;align-items:center;padding:1.5rem .5rem}
  .a-spine .code{font-size:1.875rem}
  .a-spine .prog{writing-mode:vertical-rl;transform:rotate(180deg)}
  .a-page{padding:2.5rem 2.75rem 3rem}
  .a-side{display:flex;flex-direction:column;justify-content:flex-end;padding:2.5rem 1.75rem;border-left:1px dashed #cbd5e1;background:repeating-linear-gradient(#0000 0 1.75rem,#e2e8f044 1.75rem calc(1.75rem + 1px))}
}
.a-side{display:none}
@media(min-width:48rem){.a-side{display:flex}}
.a-side .big{font-family:var(--display);font-weight:800;font-size:5.5rem;line-height:.9;letter-spacing:-.04em;color:var(--lc)}
.a-side .big small{display:block;font-family:var(--sans);font-size:.8125rem;font-weight:600;letter-spacing:0;color:var(--ink-3);margin-top:.5rem}

/* vé xếp lớp */
.a-ticket{margin-top:2rem;display:grid;background:var(--navy-800);color:#fff;position:relative}
.a-ticket header{padding:1.25rem 1.25rem 0;font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.a-ticket ol{display:grid;margin:1rem 1.25rem 0;gap:0}
.a-ticket li{display:grid;grid-template-columns:2.25rem 1fr;gap:.75rem;padding:.875rem 0;border-top:1px dashed #ffffff44;font-size:.9375rem;color:var(--navy-100)}
.a-ticket li b{font-family:var(--display);font-size:1.5rem;line-height:1;color:var(--amber);font-weight:800}
.a-ticket footer{padding:1rem 1.25rem 1.25rem;font-size:.875rem;font-weight:600;color:var(--amber)}
@media(min-width:48rem){
  .a-ticket{grid-template-columns:15rem 1fr 1fr 1fr;align-items:stretch;-webkit-mask:radial-gradient(circle .625rem at 15rem 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle .625rem at 15rem 100%,#0000 98%,#000) bottom/100% 51% no-repeat;mask:radial-gradient(circle .625rem at 15rem 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle .625rem at 15rem 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
  .a-ticket header{padding:1.75rem 1.5rem;display:flex;align-items:center;border-right:2px dashed #ffffff55;font-size:1.5rem;line-height:1.15}
  .a-ticket ol{display:contents}
  .a-ticket li{display:block;margin:0;padding:1.75rem 1.5rem;border-top:0}
  .a-ticket li+li{border-left:1px dashed #ffffff33}
  .a-ticket li b{display:block;margin-bottom:.5rem;font-size:2rem}
  .a-ticket footer{grid-column:1/-1;padding:.875rem 1.5rem;background:#00000026;border-top:0}
}

/* mục lục */
.a-toc{margin-top:4rem}
.a-toc h3{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.015em}
.a-toc>p{color:var(--ink-3);font-size:.9375rem;margin-top:.25rem}
.a-toc .list{margin-top:1.5rem;border-top:2px solid var(--ink)}
.a-toc details{border-bottom:1px solid var(--rule)}
.a-toc summary{display:grid;grid-template-columns:auto 1fr auto auto;align-items:baseline;gap:.75rem;padding:1.125rem 0;cursor:pointer;list-style:none;min-height:3.5rem}
.a-toc summary::-webkit-details-marker{display:none}
.a-toc .pt{font-family:var(--display);font-weight:800;font-size:clamp(1.125rem,3vw,1.5rem);letter-spacing:-.015em}
.a-toc .dots{border-bottom:2px dotted #94a3b8;transform:translateY(-.3em);min-width:1rem}
.a-toc .pm{font-size:.875rem;color:var(--ink-3);white-space:nowrap}
.a-toc .chev{width:1rem;height:1rem;color:var(--ink-3);transition:transform .3s var(--ease)}
.a-toc details[open] .chev{transform:rotate(180deg)}
.a-toc summary:hover .pt{color:var(--lc)}
.a-ch{display:grid;gap:2.5rem;padding:.5rem 0 2.5rem}
.a-ch article{display:grid;gap:1.25rem}
@media(min-width:48rem){.a-ch article{grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:2.5rem}}
.a-ch h4{font-family:var(--display);font-size:1.125rem;font-weight:800;letter-spacing:-.01em}
.a-ch .g{color:var(--ink-3);font-size:.9375rem;margin-top:.25rem}
.a-ch ol{margin-top:1rem;counter-reset:c}
.a-ch ol li{display:grid;grid-template-columns:4.5rem 1fr;gap:.75rem;padding:.5rem 0;border-top:1px solid var(--rule);font-size:.9375rem;color:var(--ink-2)}
.a-ch ol li b{font-size:.8125rem;color:var(--lc);font-weight:700}
.a-out{background:var(--tint);padding:1.25rem 1.25rem 1.375rem;align-self:start}
.a-out h5{font-size:.8125rem;font-weight:700;color:var(--lc);margin-bottom:.625rem}
.a-out li{position:relative;padding-left:1.25rem;margin-top:.375rem;font-size:.9375rem;color:var(--ink-2)}
.a-out li::before{content:"";position:absolute;left:0;top:.6em;width:.5rem;height:2px;background:var(--lc)}

/* =========================================================
   B · BÀN CỜ
   ========================================================= */
.b-field{background:var(--navy-900);color:#fff;position:relative;isolation:isolate;overflow:hidden}
.b-field::before{content:"";position:absolute;inset:0;z-index:-1;background:conic-gradient(#ffffff0d 25%,#0000 0 50%,#ffffff0d 0 75%,#0000 0) 0 0/6rem 6rem;mask:linear-gradient(100deg,#000 0,#0000 70%);-webkit-mask:linear-gradient(100deg,#000 0,#0000 70%)}
.b-level{display:grid;gap:2rem;padding:2.5rem 1.25rem}
.b-tile{width:min(100%,11rem);aspect-ratio:1;display:grid;grid-template:repeat(2,1fr)/repeat(2,1fr);position:relative}
.b-tile i{display:block}
.b-tile i:nth-child(1),.b-tile i:nth-child(4){background:var(--lc-b)}
.b-tile i:nth-child(2),.b-tile i:nth-child(3){background:#ffffff14}
.b-tile span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:3.25rem;letter-spacing:-.04em}
.b-body .pr{font-size:.8125rem;font-weight:600;color:var(--navy-200)}
.b-body h3{font-family:var(--display);font-weight:800;font-size:clamp(1.625rem,4.6vw,2.75rem);line-height:1.08;letter-spacing:-.02em;margin-top:.25rem;max-width:20ch;text-wrap:balance}
.b-body p{margin-top:1rem;font-size:1.0625rem;color:var(--navy-100);max-width:46ch;text-wrap:pretty}
.b-body .du{margin-top:1.25rem;display:flex;gap:1.5rem;flex-wrap:wrap;font-size:.875rem;color:var(--navy-200)}
.b-body .du b{color:var(--amber)}
@media(min-width:48rem){.b-level{grid-template-columns:11rem minmax(0,1fr);gap:3rem;padding:3.5rem 3rem;align-items:center}}
.b-moves{display:grid;background:var(--cream);border-bottom:1px solid var(--rule)}
.b-moves h3{font-family:var(--display);font-weight:800;font-size:1.25rem;padding:1.5rem 1.25rem .5rem;letter-spacing:-.01em}
.b-moves ol{display:grid}
.b-moves li{display:grid;grid-template-columns:3rem 1fr;gap:.5rem;padding:1rem 1.25rem;border-top:1px solid var(--rule);font-size:.9375rem;color:var(--ink-2)}
.b-moves li b{font-family:var(--display);font-size:1.5rem;line-height:1;font-weight:800;color:var(--amber-700)}
.b-moves p{padding:1rem 1.25rem;font-size:.875rem;font-weight:700;background:var(--amber);color:var(--navy-950)}
@media(min-width:48rem){
  .b-moves{grid-template-columns:14rem repeat(3,minmax(0,1fr));grid-template-rows:auto auto}
  .b-moves h3{grid-row:1/3;padding:1.75rem 1.5rem;align-self:center}
  .b-moves ol{display:contents}
  .b-moves li{display:block;border-top:0;border-left:1px solid var(--rule);padding:1.75rem 1.5rem}
  .b-moves li b{display:block;margin-bottom:.5rem}
  .b-moves p{grid-column:2/-1}
}
/* accordion ngang */
.b-cur{margin-top:3.5rem}
.b-cur>h3{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.015em}
.b-cur>p{color:var(--ink-3);font-size:.9375rem;margin-top:.25rem}
.b-acc{margin-top:1.5rem;display:grid;gap:0;border-top:1px solid var(--ink)}
.b-p{border-bottom:1px solid var(--ink);display:grid;grid-template-rows:auto 0fr;transition:grid-template-rows .45s var(--ease)}
.b-p[data-open=true]{grid-template-rows:auto 1fr}
.b-p>.in{overflow:hidden;min-height:0}
.b-h{display:flex;align-items:center;gap:1rem;width:100%;padding:1.125rem 0;text-align:left;min-height:3.5rem}
.b-h .sq{width:1.5rem;height:1.5rem;background:var(--lc);flex:none}
.b-h .nm{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.015em;flex:1}
.b-h .mt{font-size:.875rem;color:var(--ink-3)}
.b-h .tg{width:1.5rem;height:1.5rem;position:relative;flex:none}
.b-h .tg::before,.b-h .tg::after{content:"";position:absolute;left:50%;top:50%;width:.875rem;height:2px;background:var(--ink);transform:translate(-50%,-50%);transition:transform .35s var(--ease)}
.b-h .tg::after{transform:translate(-50%,-50%) rotate(90deg)}
.b-p[data-open=true] .tg::after{transform:translate(-50%,-50%) rotate(0)}
.b-subs{display:grid;gap:0;padding-bottom:1.5rem}
@media(min-width:64rem){
  .b-acc{display:flex;gap:0;height:auto;border-top:0;min-height:36rem}
  .b-p{display:block;border:1px solid var(--ink);margin-left:-1px;flex:1 1 4.5rem;min-width:4.5rem;transition:flex-grow .55s var(--ease);position:relative;overflow:hidden;background:var(--paper)}
  .b-p:first-child{margin-left:0}
  .b-p[data-open=true]{flex:8 1 0}
  .b-p>.in{overflow:visible;min-height:0}
  .b-h{position:absolute;inset:0 auto auto 0;width:4.5rem;height:100%;flex-direction:column;justify-content:flex-start;padding:1.25rem 0;gap:1.25rem;align-items:center;z-index:1}
  .b-h .nm{writing-mode:vertical-rl;transform:rotate(180deg);flex:none;font-size:1.125rem;white-space:nowrap;order:2}
  .b-h .mt{writing-mode:vertical-rl;transform:rotate(180deg);order:3;white-space:nowrap}
  .b-h .tg{order:4;margin-top:auto}
  .b-h .sq{order:1}
  .b-p[data-open=true] .b-h{background:var(--lc);}
  .b-p[data-open=true] .b-h .sq{background:#fff}
  .b-p[data-open=true] .b-h .nm,.b-p[data-open=true] .b-h .mt{color:#fff}
  .b-p[data-open=true] .b-h .tg::before,.b-p[data-open=true] .b-h .tg::after{background:#fff}
  .b-subs{margin-left:4.5rem;padding:1.5rem 1.75rem 2rem;opacity:0;transition:opacity .3s ease}
  .b-p[data-open=true] .b-subs{opacity:1;transition:opacity .45s .2s ease}
  .b-p:not([data-open=true]) .b-subs{visibility:hidden}
}
.b-sub{padding:1.25rem 0;border-top:1px solid var(--rule)}
.b-sub:first-child{border-top:0}
.b-sub h4{font-family:var(--display);font-weight:800;font-size:1.0625rem}
.b-sub .g{font-size:.875rem;color:var(--ink-3);margin-top:.125rem}
.b-sub .cols{display:grid;gap:1.25rem;margin-top:.875rem}
@media(min-width:48rem){.b-sub .cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.b-sub ul li{display:flex;gap:.625rem;font-size:.875rem;color:var(--ink-2);padding:.25rem 0}
.b-sub ul li b{flex:none;min-width:3.5rem;font-size:.75rem;color:var(--lc);padding-top:.1875rem}
.b-sub .out li::before{content:"";flex:none;width:.5rem;height:.5rem;margin-top:.5rem;background:var(--lc)}
.b-sub h5{font-size:.75rem;font-weight:700;color:var(--ink-3);margin-bottom:.25rem}

/* =========================================================
   C · BẢN IN (không hộp)
   ========================================================= */
.c-spread{display:grid;gap:1.5rem;border-top:3px solid var(--ink);padding-top:1.25rem;position:relative}
.c-tab{display:inline-block;background:var(--lc);color:#fff;font-family:var(--display);font-weight:800;font-size:1rem;padding:.5rem 1rem;position:absolute;top:-3px;right:0}
.c-spread .pr{font-size:.875rem;font-weight:600;color:var(--lc)}
.c-spread h3{font-family:var(--display);font-weight:800;font-size:clamp(2rem,7vw,4.75rem);line-height:1;letter-spacing:-.035em;margin-top:.5rem;text-wrap:balance;max-width:14ch}
.c-spread .goal{font-size:1.125rem;line-height:1.65;color:var(--ink-2);text-wrap:pretty;max-width:38ch}
.c-spread .du{margin-top:1rem;font-size:.875rem;color:var(--ink-3)}
.c-spread .du b{color:var(--ink)}
@media(min-width:56rem){.c-spread{grid-template-columns:minmax(0,7fr) minmax(0,4fr);column-gap:4rem;padding-top:2rem}.c-spread .goal{align-self:end;padding-bottom:.5rem}}
.c-place{margin-top:3.5rem;display:grid;gap:1.25rem;border-top:1px solid var(--ink);padding-top:1.25rem}
.c-place h3{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.c-place .q{font-family:var(--display);font-weight:700;font-size:clamp(1.25rem,3vw,1.75rem);line-height:1.3;letter-spacing:-.015em;max-width:34ch;text-wrap:balance}
.c-place .q em{font-style:normal;background:linear-gradient(transparent 62%,var(--amber) 62% 92%,transparent 92%)}
@media(min-width:56rem){.c-place{grid-template-columns:minmax(0,3fr) minmax(0,8fr);column-gap:4rem}}
.c-idx{margin-top:4rem}
.c-idx>h3{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.015em}
.c-idx>p{color:var(--ink-3);font-size:.9375rem;margin-top:.25rem}
.c-idx .rows{margin-top:1.5rem;border-top:3px solid var(--ink)}
.c-idx details{border-bottom:1px solid var(--ink)}
.c-idx summary{display:grid;grid-template-columns:3.5rem 1fr auto;gap:.5rem 1rem;align-items:center;padding:1.25rem 0;cursor:pointer;list-style:none;min-height:4.5rem;transition:background .3s var(--ease),padding .4s var(--ease)}
.c-idx summary::-webkit-details-marker{display:none}
.c-idx summary:hover{background:#0f172a08;padding-inline:.75rem}
.c-idx .n{font-family:var(--display);font-weight:800;font-size:clamp(2rem,6vw,3.5rem);line-height:1;letter-spacing:-.04em;color:var(--lc)}
.c-idx .tt{font-family:var(--display);font-weight:800;font-size:clamp(1.125rem,3vw,1.625rem);letter-spacing:-.02em;line-height:1.15}
.c-idx .tt small{display:block;font-family:var(--sans);font-size:.8125rem;font-weight:500;letter-spacing:0;color:var(--ink-3);margin-top:.25rem}
.c-idx .plus{width:2rem;height:2rem;position:relative}
.c-idx .plus::before,.c-idx .plus::after{content:"";position:absolute;left:50%;top:50%;width:1.125rem;height:2px;background:var(--ink);transform:translate(-50%,-50%);transition:transform .4s var(--ease)}
.c-idx .plus::after{transform:translate(-50%,-50%) rotate(90deg)}
.c-idx details[open] .plus::after{transform:translate(-50%,-50%) rotate(0)}
.c-cols{display:grid;padding:.5rem 0 2.5rem}
.c-cols article{padding:1.25rem 0;border-top:1px solid var(--rule)}
@media(min-width:56rem){
  .c-cols{grid-template-columns:repeat(var(--n),minmax(0,1fr));padding-left:4.5rem}
  .c-cols article{border-top:0;padding:.5rem 1.5rem 0;border-left:1px solid var(--rule)}
  .c-cols article:first-child{padding-left:0;border-left:0}
}
.c-cols h4{font-family:var(--display);font-weight:800;font-size:1.0625rem;letter-spacing:-.01em;line-height:1.2}
.c-cols .g{font-size:.875rem;color:var(--ink-3);margin-top:.25rem}
.c-cols h5{font-size:.75rem;font-weight:700;color:var(--ink-3);margin:1.25rem 0 .375rem}
.c-cols li{display:flex;gap:.625rem;padding:.25rem 0;font-size:.875rem;color:var(--ink-2)}
.c-cols li b{flex:none;min-width:3.25rem;font-size:.75rem;color:var(--lc);padding-top:.1875rem}
.c-cols .out li{font-weight:500;color:var(--ink)}
.c-cols .out li::before{content:"→";color:var(--lc);font-weight:700;flex:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="wrap" role="tablist" aria-label="Hướng thiết kế">
  <b>Giáo trình · 3 hướng thiết kế</b>
  <button role="tab" id="tab-a" aria-selected="true" aria-controls="stage-a">A · Gáy sách</button>
  <button role="tab" id="tab-b" aria-selected="false" aria-controls="stage-b">B · Bàn cờ</button>
  <button role="tab" id="tab-c" aria-selected="false" aria-controls="stage-c">C · Bản in</button>
</div></div>

<div class="picker"><div class="wrap">

l 2 – Global Chess Sơ cấp 2","duration":"24 buổi","lessonCount":"Từ bài 1 – 8","goal":"Tập trung vào các đòn chiến thuật nâng cao, tàn cuộc cơ bản và kỹ năng thi đấu.","syllabus":[{"label":"Buổi 25 – 28","topic":"Tấn công đôi (Nâng cao)"},{"label":"Buổi 29 – 32","topic":"Ghim quân (Nâng cao)"},{"label":"Buổi 33 – 36","topic":"Xiên quân (Nâng cao)"},{"label":"Buổi 37 – 40","topic":"Mở đường chiếu & Mở đường tấn công"},{"label":"Buổi 41 – 44","topic":"Hậu chống chốt sắp phong cấp"},{"label":"Buổi 45 – 46","topic":"Vua – Chốt chống Vua"},{"label":"Buổi 47 – 48","topic":"Thi đấu cờ vua & Kiểm tra cuối khóa"}],"outcomes":["Nhận diện và vận dụng các đòn chiến thuật nâng cao.","Biết cách xử lý ưu thế hơn quân và khai thác yếu điểm đối thủ.","Tự tin thi đấu và áp dụng kiến thức vào thực tế."]}]},{"id":"trung-cap","title":"Global Chess Trung Cấp","badge":"Đã nắm vững cơ bản","totalDuration":"48 buổi (2 quyển – 15 bài học chuyên sâu)","targetAudience":"Trẻ từ 7 – 12 tuổi (đã nắm vững kiến thức cơ bản, muốn nâng cao kỹ năng)","sessionLength":"60 – 90 phút / buổi (điều chỉnh theo độ tuổi)","objectives":["Nắm vững các khai cuộc và hệ thống phòng thủ phổ biến.","Hiểu và vận dụng các đòn chiến thuật nâng cao trong trung cuộc.","Phát triển tư duy chiến lược và khả năng phân tích thế cờ sâu.","Tự tin thi đấu và xử lý tình huống thực tế."],"evaluation":["Sau 24 buổi đầu: Làm chủ các khai cuộc và phòng thủ cơ bản, biết xử lý giai đoạn mở đầu.","Sau 48 buổi: Nắm vững chiến thuật trung - tàn cuộc nâng cao, áp dụng linh hoạt trong thực chiến."],"subLevels":[{"code":"TC1","name":"Global Chess Trung cấp – Quyển 1","duration":"24 buổi","lessonCount":"5 Bài học hệ thống khai cuộc & phòng thủ","goal":"Làm chủ các hệ thống phòng thủ kinh điển và hình thành tư duy chiến lược ngay từ khai cuộc.","syllabus":[{"label":"Bài 1","topic":"Khai cuộc nửa thoáng"},{"label":"Bài 2","topic":"Sai lầm cần tránh trong khai cuộc nửa thoáng"},{"label":"Bài 3","topic":"Phòng thủ Sicilian (Sicilian Defense)"},{"label":"Bài 4","topic":"Phòng thủ Pháp (French Defense)"},{"label":"Bài 5","topic":"Phòng thủ Caro-Kann (Caro-Kann Defense)"}],"outcomes":["Nắm vững các khai cuộc phổ biến và cách ứng dụng.","Nhận diện sai lầm thường gặp trong khai cuộc nửa thoáng.","Hiểu rõ đặc điểm và cách phòng thủ của từng hệ thống.","Có tư duy chiến lược ngay từ giai đoạn mở màn."]},{"code":"TC2","name":"Global Chess Trung cấp – Quyển 2","duration":"24 buổi","lessonCount":"10 Bài học chiến thuật & tàn cuộc thực chiến","goal":"Kiểm soát thế cờ bằng các đòn phối hợp trung cuộc phức tạp và kỹ năng tàn cuộc chống chốt.","syllabus":[{"label":"Bài 1","topic":"Phòng thủ Scandinavian"},{"label":"Bài 2","topic":"Đòn tiêu diệt quân bảo vệ"},{"label":"Bài 3","topic":"Đòn quá tải (Overloading)"},{"label":"Bài 4","topic":"Đòn thu hút (Attraction)"},{"label":"Bài 5","topic":"Đòn đánh lạc hướng (Deflection)"},{"label":"Bài 6","topic":"Đòn phong toả (Blockade)"},{"label":"Bài 7","topic":"Đòn giải phóng ô, đường (Clearance)"},{"label":"Bài 8","topic":"Mã chống chốt"},{"label":"Bài 9","topic":"Tượng chống chốt"},{"label":"Bài 10","topic":"Xe chống chốt"}],"outcomes":["Làm chủ các đòn chiến thuật nâng cao trong trung cuộc.","Kỹ năng xử lý quân và kiểm soát thế cờ chặt chẽ.","Tư duy phân tích và lựa chọn nước đi tối ưu.","Vận dụng chiến thuật linh hoạt trong ván đấu thực tế."]}]}],"SESSION_TIMELINE":[{"time":"5 phút","title":"Ôn bài cũ","desc":"Nhắc lại kiến thức đã học buổi trước"},{"time":"15 phút","title":"Giảng bài mới","desc":"Giải thích nguyên lý & minh họa trực quan"},{"time":"20 phút","title":"Luyện tập","desc":"Giải bài tập tình huống trên giáo trình"},{"time":"15 phút","title":"Thực hành bàn cờ","desc":"Thi đấu áp dụng kiến thức vừa học"},{"time":"5 phút","title":"Nhận xét & Giao bài","desc":"Tổng kết lỗi sai, chuẩn bị bài buổi sau"}]};
const PROGS = DATA.CURRICULUM_PROGRAMS;

const progMeta = p => { const m=p.totalDuration.match(/^(\d+)\s*buổi/), a=p.targetAudience.match(/từ\s*(\d+)/); return [m&&m[1]+" buổi",a&&"từ "+a[1]+" tuổi"].filter(Boolean).join(" · "); };

const cur = () => LEVELS.find(l=>l.code===sel);

/* ---------- A ---------- */
function A(){

      <div class="a-ch">${p.subLevels.map(s=>`<article><div><h4>${esc(s.name)}</h4><p class="g">${esc(s.goal)}</p>${lessons(s)}</div>
        <aside class="a-out"><h5>Kết quả sau ${esc(s.duration)}</h5><ul>${s.outcomes.map(o=>`<li>${esc(o)}</li>`).join("")}</ul></aside></article>`).join("")}</div>
    </details>`}).join("")}</div>
  </div>`;
}

    <div class="b-acc" id="b-acc">${PROGS.map((p,i)=>{const [c]=col(p.id);return `<div class="b-p" data-open="${i===0}" style="--lc:${c}">

      <div class="in" id="bp-${i}"><div class="b-subs">${p.subLevels.map(s=>`<div class="b-sub"><h4>${esc(s.name)}</h4><p class="g">${esc(s.goal)}</p>
        <div class="cols"><div><h5>Nội dung chi tiết</h5>${ul(s)}</div><div><h5>Kết quả sau ${esc(s.duration)}</h5><ul class="out">${s.outcomes.map(o=>`<li><span>${esc(o)}</span></li>`).join("")}</ul></div></div></div>`).join("")}</div></div>
    </div>`}).join("")}</div>

}
const ul = s => `<ul>${s.syllabus.map(x=>`<li><b class="num">${esc(x.label)}</b><span>${esc(x.topic)}</span></li>`).join("")}</ul>`;

/* ---------- C ---------- */
function C(){
  const l=cur(), [c]=col(l.p.id);
  return `<p class="note">Hướng C — Bản in biên tập: không hộp, không bo góc. Chữ lớn và đường kẻ dựng cấu trúc; mục xếp lớp là một câu trích, giáo trình là bảng chỉ mục với cột theo từng cấp độ.</p>

/* ---------- điều khiển ---------- */
function render(){
  const open = [...document.querySelectorAll("#stage-a details,#stage-c details")].map(d=>d.open);
  const bOpen = [...document.querySelectorAll(".b-p")].map(d=>d.dataset.open==="true");
  $("#stage-a").innerHTML=A(); $("#stage-b").innerHTML=B(); $("#stage-c").innerHTML=C();
  const ds=[...document.querySelectorAll("#stage-a details,#stage-c details")];
  if(open.length===ds.length) ds.forEach((d,i)=>d.open=open[i]);
  if(bOpen.length) document.querySelectorAll(".b-p").forEach((d,i)=>{d.dataset.open=bOpen[i];d.querySelector("button").setAttribute("aria-expanded",bOpen[i])});
  $("#picker").innerHTML=LEVELS.map(x=>`<li><button aria-pressed="${x.code===sel}" data-c="${x.code}">${x.code}</button></li>`).join("");
}
document.addEventListener("click",e=>{
  const pk=e.target.closest("#picker button"); if(pk){sel=pk.dataset.c;render();return}
  const bh=e.target.closest(".b-h"); if(bh){const p=bh.parentElement,all=[...document.querySelectorAll(".b-p")],wide=matchMedia("(min-width:64rem)").matches;
    const next=wide?true:p.dataset.open!=="true";
    all.forEach(x=>{const on=wide?x===p:(x===p?next:x.dataset.open==="true");x.dataset.open=on;x.querySelector("button").setAttribute("aria-expanded",on)})}
  const tab=e.target.closest(".bar [role=tab]"); if(tab){document.querySelectorAll(".bar [role=tab]").forEach(t=>t.setAttribute("aria-selected",t===tab));
    document.querySelectorAll(".stage").forEach(s=>s.hidden=s.id!==tab.getAttribute("aria-controls"));scrollTo({top:0})}
});
render();
</script>
</body>
