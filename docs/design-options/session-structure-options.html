<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Chess – 3 hướng thiết kế cho Cấu trúc buổi học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --n950:#0b2136;--n900:#123350;--n800:#184268;--n700:#1b4a76;--n600:#1f5285;--n500:#2f6ba3;--n300:#8fb4d6;--n200:#b6d0e8;--n100:#d9e8f5;--n50:#eef5fb;
  --cream:#faf8f5;--ink:#0f172a;--ink2:#334155;--ink3:#64748b;--rule:#e2e8f0;--amber:#fbbf24;--amber7:#b45309;
  --display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;--sans:"Be Vietnam Pro",system-ui,sans-serif;--ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased}
::selection{background:var(--amber);color:var(--n950)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--amber7);outline-offset:3px}
ol,ul{list-style:none;padding:0}
.wrap{max-width:72rem;margin:0 auto;padding:0 1rem}
.num{font-variant-numeric:tabular-nums}
.bar{position:sticky;top:0;z-index:20;background:var(--n950);color:#fff}
.bar .wrap{display:flex;gap:.25rem;align-items:center;flex-wrap:wrap;padding-block:.5rem}
.bar b{font-family:var(--display);margin-right:auto;font-size:.9375rem}
.bar button{padding:.5rem .875rem;font-size:.8125rem;font-weight:600;color:var(--n200);min-height:2.75rem;border-bottom:2px solid transparent}
.bar button[aria-selected=true]{color:#fff;border-color:var(--amber)}
.stage{padding:3rem 0 5rem}.stage[hidden]{display:none}
.note{font-size:.8125rem;color:var(--ink3);max-width:46rem;margin-bottom:2rem}
.head h2{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,3.5vw,2.25rem);letter-spacing:-.02em;line-height:1.1}
.head p{color:var(--ink3);margin-top:.5rem}

/* A · thanh tỉ lệ */
.a-strip{display:flex;margin-top:2rem;height:4.5rem}
.a-strip i{flex:var(--m) 1 0;min-width:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--display);font-weight:800;font-size:1.25rem;color:#fff;background:var(--c);transition:flex-grow .5s var(--ease)}
.a-strip i+i{border-left:2px solid var(--cream)}
.a-strip i small{font-family:var(--sans);font-size:.75rem;font-weight:600;margin-left:.25rem;opacity:.85}
.a-ticks{display:flex;justify-content:space-between;margin-top:.5rem;font-size:.75rem;color:var(--ink3)}
.a-cols{display:grid;gap:1.5rem;margin-top:2rem}
.a-cols li{display:grid;grid-template-columns:1rem 1fr;gap:.75rem;padding-top:1rem;border-top:2px solid var(--c)}
.a-cols li::before{content:"";width:1rem;height:1rem;background:var(--c);margin-top:.25rem}
.a-cols h3{font-family:var(--display);font-weight:800;font-size:1.0625rem;letter-spacing:-.01em;line-height:1.25}
.a-cols p{font-size:.875rem;color:var(--ink2);margin-top:.25rem}
@media(min-width:48rem){.a-cols{grid-template-columns:repeat(5,minmax(0,1fr));gap:1.25rem}.a-cols li{grid-template-columns:1fr;gap:0}.a-cols li::before{display:none}.a-cols h3{margin-top:0}}
@media(max-width:47.99rem){.a-strip{height:auto;flex-direction:column;width:4.5rem;float:left;margin:2rem 1.25rem 0 0}.a-strip i{flex:none;height:calc(var(--m)*.35rem + 2.5rem)}.a-strip i small{display:none}.a-strip i+i{border-left:0;border-top:2px solid var(--cream)}.a-ticks{display:none}.a-cols{margin-top:2rem;gap:0}.a-cols li{padding:.5rem 0 1rem;border-top:0;min-height:calc(var(--m)*.35rem + 2.5rem)}.a-cols li::before{display:none}.a-cols li{grid-template-columns:1fr}}

/* B · gantt */
.b-sheet{margin-top:2rem;border-top:3px solid var(--ink);background:#fff}
.b-row{display:grid;grid-template-columns:4.5rem 1fr;gap:.25rem 1rem;padding:1.125rem 0;border-bottom:1px solid var(--rule);align-items:start}
.b-min{font-family:var(--display);font-weight:800;font-size:2.5rem;letter-spacing:-.04em;line-height:1;color:var(--n800)}
.b-min small{display:block;font-family:var(--sans);font-size:.75rem;font-weight:600;letter-spacing:0;color:var(--ink3);margin-top:.125rem}
.b-row h3{font-family:var(--display);font-weight:800;font-size:1.125rem;letter-spacing:-.01em}
.b-row p{font-size:.9375rem;color:var(--ink2)}
.b-track{grid-column:1/-1;position:relative;height:.75rem;background:repeating-linear-gradient(90deg,var(--rule) 0 1px,#0000 1px calc(100%/12));border-left:1px solid var(--rule);margin-top:.5rem}
.b-track i{position:absolute;top:0;bottom:0;left:calc(var(--s)/60*100%);width:calc(var(--m)/60*100%);background:var(--c)}
.b-axis{display:none}
@media(min-width:56rem){
  .b-row{grid-template-columns:5rem minmax(0,2fr) minmax(0,3fr);gap:0 2rem;padding:1.375rem 1rem;align-items:center}
  .b-track{grid-column:auto;margin-top:0;height:1.25rem}
  .b-axis{display:grid;grid-template-columns:5rem minmax(0,2fr) minmax(0,3fr);gap:0 2rem;padding:.75rem 1rem;font-size:.75rem;color:var(--ink3)}
  .b-axis span:last-child{display:flex;justify-content:space-between}
  .b-sheet{background:none}
  .b-row:hover{background:#0f172a08}
}
.b-total{display:flex;justify-content:space-between;align-items:baseline;padding:1rem 0;border-top:3px solid var(--ink);font-family:var(--display);font-weight:800;font-size:1.125rem}
.b-total span:last-child{font-size:2rem;letter-spacing:-.03em;color:var(--n800)}

/* C · đồi thời lượng */
.c-field{background:var(--n900);color:#fff;margin-top:2rem;padding:2.5rem 1.25rem 0;position:relative;overflow:hidden;isolation:isolate}
.c-field::before{content:"";position:absolute;inset:0;z-index:-1;background:conic-gradient(#ffffff0a 25%,#0000 0 50%,#ffffff0a 0 75%,#0000 0) 0 0/5rem 5rem}
.c-cols{display:grid;gap:1px;align-items:end}
.c-cols li{display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.c-cols .t{padding:1.25rem 1rem 1.5rem;background:var(--c);height:calc(9rem + var(--m)*.5rem);display:flex;flex-direction:column;justify-content:flex-end;transition:filter .3s var(--ease)}
.c-cols li:hover .t{filter:brightness(1.08)}
.c-cols b{font-family:var(--display);font-weight:800;font-size:2.5rem;letter-spacing:-.04em;line-height:1;color:var(--amber)}
.c-cols b small{font-family:var(--sans);font-size:.75rem;font-weight:600;letter-spacing:0;color:var(--n100);margin-left:.25rem}
.c-cols h3{font-family:var(--display);font-weight:800;font-size:1rem;margin-top:.5rem;line-height:1.25}
.c-cols p{font-size:.8125rem;color:var(--n100);margin-top:.25rem;line-height:1.5}
@media(max-width:47.99rem){.c-field{padding:1.25rem 0 0}.c-cols{gap:0}.c-cols .t{height:auto;width:calc(55% + var(--m)*2%);padding:1rem 1.25rem}}
@media(min-width:48rem){.c-field{padding:3rem 2rem 0}.c-cols{grid-template-columns:repeat(5,minmax(0,1fr))}}
.c-foot{display:flex;justify-content:space-between;padding:1rem 0;font-size:.8125rem;color:var(--n200);border-top:1px solid #ffffff33}
@media(max-width:47.99rem){.c-foot{padding-inline:1.25rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="wrap" role="tablist">
  <b>Cấu trúc buổi học · 3 hướng</b>
  <button role="tab" id="tab-a" aria-selected="true" aria-controls="s-a">A · Thanh tỉ lệ</button>
  <button role="tab" id="tab-b" aria-selected="false" aria-controls="s-b">B · Biểu đồ Gantt</button>
  <button role="tab" id="tab-c" aria-selected="false" aria-controls="s-c">C · Đồi thời lượng</button>
</div></div>
<main class="wrap">
  <section class="stage" id="s-a" role="tabpanel" aria-labelledby="tab-a"></section>
  <section class="stage" id="s-b" role="tabpanel" aria-labelledby="tab-b" hidden></section>
  <section class="stage" id="s-c" role="tabpanel" aria-labelledby="tab-c" hidden></section>
</main>
<script>
const T = [{"time": "5 phút", "title": "Ôn bài cũ", "desc": "Nhắc lại kiến thức đã học buổi trước"}, {"time": "15 phút", "title": "Giảng bài mới", "desc": "Giải thích nguyên lý & minh họa trực quan"}, {"time": "20 phút", "title": "Luyện tập", "desc": "Giải bài tập tình huống trên giáo trình"}, {"time": "15 phút", "title": "Thực hành bàn cờ", "desc": "Thi đấu áp dụng kiến thức vừa học"}, {"time": "5 phút", "title": "Nhận xét & Giao bài", "desc": "Tổng kết lỗi sai, chuẩn bị bài buổi sau"}].map((x,i,a)=>({...x,m:parseInt(x.time,10),s:a.slice(0,i).reduce((n,y)=>n+parseInt(y.time,10),0)}));
const TOTAL = T.reduce((n,x)=>n+x.m,0);
const COL = ["#2f6ba3","#1f5285","#184268","#b45309","#4d7fae"];
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const head = '<div class="head"><h2>Cấu trúc chuẩn mỗi buổi học</h2><p>Phương pháp sư phạm: Lý thuyết – Bài tập – Thực chiến</p></div>';

const A = () => `<p class="note">Hướng A — Cả buổi là một thanh dài ${TOTAL} phút; mỗi bước chiếm đúng bề rộng theo số phút nên người xem thấy ngay phần nào dài nhất. Góc vuông, không thẻ. Trên điện thoại thanh dựng dọc.</p>${head}
  <div class="a-strip" role="img" aria-label="Thanh thời gian ${TOTAL} phút">${T.map((x,i)=>`<i style="--m:${x.m};--c:${COL[i]}">${x.m}<small>′</small></i>`).join("")}</div>
  <div class="a-ticks"><span>0</span><span>${TOTAL} phút</span></div>
  <ol class="a-cols">${T.map((x,i)=>`<li style="--c:${COL[i]};--m:${x.m}"><div><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p></div></li>`).join("")}</ol>`;

const B = () => `<p class="note">Hướng B — Bảng giờ dạng Gantt: mỗi hàng có số phút lớn, mô tả, và một vạch nằm đúng vị trí trong ${TOTAL} phút (bắt đầu lúc nào, kéo dài bao lâu). Rõ nhất khi cần nói "buổi học diễn ra theo trình tự nào".</p>${head}
  <div class="b-sheet">
    <div class="b-axis" aria-hidden="true"><span></span><span></span><span><span>0′</span><span>15′</span><span>30′</span><span>45′</span><span>${TOTAL}′</span></span></div>
    ${T.map((x,i)=>`<div class="b-row"><div class="b-min num">${x.m}<small>phút</small></div><div><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p></div><div class="b-track" aria-hidden="true"><i style="--s:${x.s};--m:${x.m};--c:${i===3?COL[3]:COL[2]}"></i></div></div>`).join("")}
    <div class="b-total"><span>Tổng thời lượng lý thuyết và thực hành</span><span class="num">${TOTAL} phút</span></div>
  </div>`;

const C = () => `<p class="note">Hướng C — Năm khối cột đáy thẳng hàng, chiều cao theo số phút nên cả dãy tạo thành "ngọn đồi" đỉnh ở Luyện tập; nền ô cờ đồng bộ với phần khác của trang. Trên điện thoại các khối xếp dọc, độ rộng theo số phút.</p>
  <div class="c-field"><div class="head"><h2>Cấu trúc chuẩn mỗi buổi học</h2><p style="color:var(--n200)">Phương pháp sư phạm: Lý thuyết – Bài tập – Thực chiến</p></div>
    <ol class="c-cols" style="margin-top:2.5rem">${T.map((x,i)=>`<li style="--m:${x.m};--c:${i===3?"#8a4308":COL[[2,1,0,3,1][i]===3?3:[2,1,0,3,1][i]]}"><div class="t"><b class="num">${x.m}<small>phút</small></b><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p></div></li>`).join("")}</ol>
    <div class="c-foot"><span>Tổng ${TOTAL} phút</span><span>Thực chiến chiếm ${T[3].m} phút</span></div>
  </div>`;

document.getElementById("s-a").innerHTML=A();
document.getElementById("s-b").innerHTML=B();
document.getElementById("s-c").innerHTML=C();
document.querySelector(".bar").addEventListener("click",e=>{const t=e.target.closest("[role=tab]");if(!t)return;
  document.querySelectorAll(".bar [role=tab]").forEach(x=>x.setAttribute("aria-selected",x===t));
  document.querySelectorAll(".stage").forEach(s=>s.hidden=s.id!==t.getAttribute("aria-controls"));scrollTo(0,0)});
</script>
</body>
</html>
